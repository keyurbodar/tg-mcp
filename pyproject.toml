[project]
name = "tg-mcp"
version = "0.2.0"
description = "Universal personal Telegram MCP server (DMs, groups, channels, unread sync, live push)"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "telethon==1.46.0",
    "uvicorn==0.38.0",
]

[project.optional-dependencies]
test = ["pytest", "httpx"]

[tool.setuptools]
packages = ["tg_mcp"]
