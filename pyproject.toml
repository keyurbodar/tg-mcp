[project]
name = "hub-block-tg"
version = "0.1.0"
description = "Telegram ingestion + remote MCP triage for Hub Block"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "telethon==1.46.0",
    "uvicorn==0.38.0",
]

[project.optional-dependencies]
test = ["pytest", "httpx"]

[tool.setuptools]
packages = ["hub_tg"]
